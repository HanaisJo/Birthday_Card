<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card-container">
    <div class="card">
      <div class="front">
        <h1>🎉 Happy Birthday! 🎉</h1>
        <p>Click or hover to open</p>
      </div>
      <div class="back">
        <h2>To [Friend's Name],</h2>
        <p>Wishing you an incredible year ahead filled with success, laughter, and great adventures!</p>
        <p class="signature">Best, <br>[Your Name]</p>
      </div>
    </div>
  </div>
</body>
</html>
